[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowforge"
version = "0.3.0"
description = "Scope-enforced LLM harness for authorized penetration testing workflows"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "rikterskale"}]
dependencies = []

[project.optional-dependencies]
dev = [
  "build==1.5.0",
  "coverage[toml]==7.15.4",
  "pip-audit==2.10.1",
  "pytest==9.1.1",
  "ruff==0.16.2",
]

[project.scripts]
shadowforge = "shadowforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["shadowforge"]

[tool.coverage.report]
fail_under = 99
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
